<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Atelier de dessin</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --paper:#EDEAE2;
    --parchment:#FFFFFF;
    --ink:#1F2421;
    --clay:#B5533C;
    --sage:#5C6B57;
    --line:#C9C3B4;
    --tool-bg:#E2DDD0;
    --panel-bg:#E8E3D5;
    --gold:#C9982F;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; height:100%;
    background:var(--paper);
    font-family:'Iowan Old Style','Georgia',serif;
    color:var(--ink);
    overscroll-behavior:none;
    touch-action:manipulation;
  }
  body{ display:flex; flex-direction:column; height:100vh; height:100dvh; width:100vw; overflow:hidden; }
  header{
    padding:12px 16px 8px 16px;
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  h1{ margin:0; font-size:18px; font-weight:400; letter-spacing:0.02em; }
  h1 em{ font-style:italic; color:var(--clay); }

  #canvas-wrap{
    flex:1; position:relative; min-height:0;
    background:var(--parchment);
    overflow:hidden;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  #stage{
    position:absolute; inset:0;
    transform-origin:50% 50%;
  }
  #guideImg{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:contain; pointer-events:none; display:none;
    -webkit-user-drag:none;
  }
  #grid, #preview, #input, .layer-canvas{
    position:absolute; inset:0; width:100%; height:100%;
    touch-action:none;
  }
  #grid, #preview{ pointer-events:none; }
  #input{ cursor:crosshair; }
  #layersContainer{ position:absolute; inset:0; }

  #zoomControls{
    position:absolute; top:8px; right:8px; z-index:5;
    display:flex; flex-direction:column; gap:4px;
  }
  .zoomBtn{
    width:32px; height:32px; border-radius:50%;
    border:1px solid var(--line); background:rgba(242,236,220,0.9);
    color:var(--ink); font-size:16px; cursor:pointer; line-height:1;
  }

  #toolbar{
    flex-shrink:0; background:var(--tool-bg);
    border-top:1px solid var(--line);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px)) 10px;
    display:flex; flex-direction:column; gap:8px;
    max-height:64vh; max-height:64dvh; overflow-y:auto;
  }
  .row{ display:flex; align-items:center; gap:8px; }
  .row.wrap{ flex-wrap:wrap; }
  .scroller{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; -webkit-overflow-scrolling:touch; }
  .scroller::-webkit-scrollbar{ display:none; }

  button.tool{
    background:var(--paper); border:1px solid var(--line); border-radius:7px;
    padding:8px 11px; font-family:inherit; font-size:13px; color:var(--ink);
    cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  button.tool.active{ background:var(--ink); color:var(--parchment); border-color:var(--ink); }
  button.tool.gold-active{
    background:linear-gradient(135deg,#8a6512,#e8c464 50%,#8a6512);
    color:#1F2421; border-color:var(--gold);
  }
  button.tool:active{ transform:scale(0.96); }
  button.icon-only{ padding:8px 10px; }

  .label{ font-size:11.5px; color:var(--sage); min-width:0; white-space:nowrap; }
  input[type=range]{ flex:1; accent-color:var(--clay); min-width:50px; }

  #currentColorBtn{
    width:32px; height:32px; border-radius:50%;
    border:2px solid var(--ink); flex-shrink:0; cursor:pointer; padding:0;
  }
  .colorDot{
    width:32px; height:32px; border-radius:50%;
    border:2px solid var(--ink); flex-shrink:0; cursor:pointer; padding:0;
  }
  .colorDot.target{ box-shadow:0 0 0 2px var(--clay); }
  .swapBtn{ background:none; border:none; font-size:16px; cursor:pointer; color:var(--ink); flex-shrink:0; }
  #recentSwatches{ display:flex; gap:6px; overflow-x:auto; padding-bottom:2px; }
  .swatch{
    width:26px; height:26px; border-radius:50%;
    border:2px solid transparent; padding:0; cursor:pointer; flex-shrink:0;
  }
  .swatch.active{ border-color:var(--ink); transform:scale(1.08); }
  .addSwatch{
    width:26px; height:26px; border-radius:50%; flex-shrink:0;
    border:1px dashed var(--sage); background:var(--paper);
    font-size:14px; color:var(--sage); cursor:pointer; line-height:1;
  }

  #panelWrap{ display:none; flex-direction:column; }
  #panelWrap.open{ display:flex; }
  #panelTabs{
    display:flex; gap:6px; overflow-x:auto;
    background:var(--panel-bg); border-radius:8px 8px 0 0;
    padding:10px 10px 4px 10px;
  }
  #panelTabs::-webkit-scrollbar{ display:none; }
  .ptab{
    background:transparent; border:none; border-bottom:2px solid transparent;
    padding:5px 8px; font-family:inherit; font-size:12.5px; color:var(--sage);
    cursor:pointer; white-space:nowrap; flex-shrink:0;
  }
  .ptab.active{ color:var(--ink); border-bottom-color:var(--clay); font-weight:600; }

  #panelBody{
    background:var(--panel-bg); border-radius:0 0 8px 8px; padding:10px;
    display:flex; flex-direction:column; gap:8px;
    max-height:34vh; max-height:34dvh; overflow-y:auto;
  }
  .panel-section{ display:none; flex-direction:column; gap:8px; }
  .panel-section.active{ display:flex; }

  .choice-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .choice-row button{
    background:var(--paper); border:1px solid var(--line); border-radius:7px;
    padding:7px 11px; font-family:inherit; font-size:12px; color:var(--ink); cursor:pointer;
  }
  .choice-row button.active{ border-color:var(--clay); background:#fff; }

  .bg-swatch{ width:30px; height:30px; border-radius:6px; border:2px solid var(--line); cursor:pointer; flex-shrink:0; }
  .bg-swatch.active{ border-color:var(--clay); }

  .toggle-row{ display:flex; align-items:center; gap:8px; font-size:13px; }
  .toggle-row input[type=checkbox]{ accent-color:var(--clay); width:16px; height:16px; }

  #fileLabel, #layerImgLabel{
    background:var(--paper); border:1px solid var(--line); border-radius:7px;
    padding:7px 12px; font-size:13px; cursor:pointer; display:inline-block; width:fit-content;
  }
  #fileInput, #layerImageInput{ display:none; }

  #settingsToggle{ background:transparent; border:1px solid var(--sage); color:var(--sage); }
  #settingsToggle.open{ background:var(--sage); color:var(--parchment); }

  #svCanvas{ width:100%; max-width:260px; height:150px; border-radius:8px; display:block; touch-action:none; }
  #hueCanvas{ width:100%; max-width:260px; height:18px; border-radius:8px; display:block; touch-action:none; margin-top:4px; }
  #hexInput{
    font-family:monospace; font-size:13px; padding:6px 8px;
    border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink);
  }

  .layer-row{
    display:flex; align-items:center; gap:6px; padding:6px 8px;
    border-radius:7px; background:var(--paper); border:1px solid transparent;
    flex-wrap:wrap; row-gap:6px;
  }
  .layer-row.active{ border-color:var(--clay); }
  .layer-row .lname{ flex:1 1 100%; font-size:12.5px; font-weight:600; }
  .layer-row button{ background:none; border:none; font-size:14px; cursor:pointer; padding:2px 5px; color:var(--ink); }
  .layer-row input[type=range]{ width:54px; flex:none; }
  .layer-row select{ font-size:11px; border-radius:5px; border:1px solid var(--line); background:#fff; color:var(--ink); max-width:80px; flex:none; }
  .layer-add-row{ display:flex; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>

<header>
  <h1>Atelier de <em>dessin</em></h1>
</header>

<div id="canvas-wrap">
  <div id="stage">
    <img id="guideImg" alt="guide">
    <canvas id="grid"></canvas>
    <div id="layersContainer"></div>
    <canvas id="preview"></canvas>
    <canvas id="input"></canvas>
  </div>
  <div id="zoomControls">
    <button class="zoomBtn" id="zoomInBtn">+</button>
    <button class="zoomBtn" id="zoomOutBtn">–</button>
    <button class="zoomBtn" id="zoomResetBtn">⤾</button>
  </div>
</div>

<div id="toolbar">

  <div class="row scroller">
    <button class="tool active" id="brushBtn" data-tool="brush">Pinceau</button>
    <button class="tool" id="quillBtn" data-tool="quill">Plume</button>
    <button class="tool" id="goldBtn" data-tool="gold">Or</button>
    <button class="tool" id="shapeBtn" data-tool="shape">Forme</button>
    <button class="tool" id="fillBtn" data-tool="fill">Remplir</button>
    <button class="tool" id="gradientBtn" data-tool="gradient">Dégradé</button>
    <button class="tool" id="eyedropperBtn" data-tool="eyedropper">Pipette</button>
    <button class="tool" id="eraserBtn" data-tool="eraser">Gomme</button>
    <button class="tool icon-only" id="undoBtn">↶</button>
    <button class="tool icon-only" id="redoBtn">↷</button>
  </div>

  <div class="row">
    <button id="currentColorBtn" class="colorDot" title="Couleur 1"></button>
    <button id="secondaryColorBtn" class="colorDot" title="Couleur 2 (dégradé)"></button>
    <button id="swapColorsBtn" class="swapBtn" title="Échanger">⇄</button>
    <div class="scroller" id="swatches" style="flex:1;"></div>
    <button class="addSwatch" id="addSwatchBtn" title="Ajouter à la palette">+</button>
  </div>

  <div class="row">
    <span class="label" id="sizeLabel">Taille 4</span>
    <input type="range" id="sizeRange" min="1" max="40" value="4">
    <button class="tool icon-only" id="settingsToggle">Réglages</button>
    <button class="tool icon-only" id="saveBtn">⤓</button>
    <button class="tool icon-only" id="clearBtn">✕</button>
  </div>

  <div id="panelWrap">
    <div id="panelTabs">
      <button class="ptab active" data-panel="color">Couleur</button>
      <button class="ptab" data-panel="brushset">Pinceau</button>
      <button class="ptab" data-panel="quillset">Plume</button>
      <button class="ptab" data-panel="shapeset">Forme</button>
      <button class="ptab" data-panel="symmetry">Symétrie</button>
      <button class="ptab" data-panel="layers">Calques</button>
      <button class="ptab" data-panel="toile">Toile</button>
      <button class="ptab" data-panel="guide">Calque guide</button>
      <button class="ptab" data-panel="grid">Grille</button>
      <button class="ptab" data-panel="export">Export</button>
      <button class="ptab" data-panel="history">Historique</button>
    </div>

    <div id="panelBody">
    <div class="panel-section active" id="panel-color">
      <canvas id="svCanvas" width="260" height="150"></canvas>
      <canvas id="hueCanvas" width="260" height="18"></canvas>
      <div class="row">
        <span class="label">Hex</span>
        <input type="text" id="hexInput" value="#1F2421">
      </div>
      <div class="label">Récents</div>
      <div id="recentSwatches"></div>
      <div class="label">Harmonies</div>
      <div id="harmonySwatches" style="display:flex; gap:6px;"></div>
    </div>

    <div class="panel-section" id="panel-brushset">
      <div class="choice-row">
        <button class="active" data-brush="round">Rond</button>
        <button data-brush="soft">Doux</button>
        <button data-brush="marker">Marqueur</button>
        <button data-brush="grain">Grain papier</button>
        <button data-brush="hatch">Hachures</button>
        <button data-brush="watercolor">Aquarelle</button>
        <button data-brush="pattern">Motif</button>
      </div>
      <div class="row">
        <span class="label">Opacité</span>
        <input type="range" id="brushOpacity" min="10" max="100" value="100">
      </div>
    </div>

    <div class="panel-section" id="panel-quillset">
      <div class="row">
        <span class="label">Angle du bec</span>
        <input type="range" id="nibAngle" min="0" max="179" value="45">
        <span class="label" id="nibAngleLabel">45°</span>
      </div>
      <div class="label">Astuce : varie l'angle pour changer le style d'écriture.</div>
    </div>

    <div class="panel-section" id="panel-shapeset">
      <div class="choice-row">
        <button class="active" data-shape="line">Ligne</button>
        <button data-shape="rect">Rectangle</button>
        <button data-shape="circle">Cercle</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="shapeFill">
        <label for="shapeFill">Remplir la forme</label>
      </div>
    </div>

    <div class="panel-section" id="panel-symmetry">
      <div class="row">
        <span class="label">Répétitions</span>
        <input type="range" id="symCount" min="1" max="12" value="1">
        <span class="label" id="symCountLabel">1</span>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="symMirror">
        <label for="symMirror">Miroir (symétrie bilatérale)</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="symShowAxes" checked>
        <label for="symShowAxes">Afficher le centre et les axes</label>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="symMoveCenter">
        <label for="symMoveCenter">Déplacer le centre (tape/glisse sur la toile)</label>
      </div>
    </div>

    <div class="panel-section" id="panel-layers">
      <div class="layer-add-row">
        <button class="tool" id="addLayerBtn">+ Calque</button>
        <label id="layerImgLabel" for="layerImageInput">🖼 Depuis une photo</label>
        <input type="file" id="layerImageInput" accept="image/*">
      </div>
      <div class="choice-row">
        <button id="mirrorHBtn">↔ Miroir H</button>
        <button id="mirrorVBtn">↕ Miroir V</button>
        <button id="rotate180Btn">↻ 180°</button>
      </div>
      <div class="choice-row">
        <button id="filterGrayBtn">N&B</button>
        <button id="filterSepiaBtn">Sépia</button>
        <button id="filterInvertBtn">Inverser</button>
        <button id="filterContrastBtn">Contraste+</button>
      </div>
      <div id="layerList"></div>
    </div>

    <div class="panel-section" id="panel-toile">
      <div class="row">
        <button class="bg-swatch" data-bg="#F2ECDC" style="background:#F2ECDC;" title="Parchemin"></button>
        <button class="bg-swatch active" data-bg="#FFFFFF" style="background:#FFFFFF;" title="Blanc"></button>
        <button class="bg-swatch" data-bg="#F7F3E8" style="background:#F7F3E8;" title="Ivoire"></button>
        <button class="bg-swatch" data-bg="#E4E2DC" style="background:#E4E2DC;" title="Gris clair"></button>
        <button class="bg-swatch" data-bg="#2B2E30" style="background:#2B2E30;" title="Ardoise"></button>
        <input type="color" id="customBg" value="#FFFFFF" title="Fond personnalisé">
      </div>
      <div class="label">Format de toile</div>
      <div class="choice-row">
        <button class="active" data-preset="libre">Libre (plein écran)</button>
        <button data-preset="carre">Carré 1:1</button>
        <button data-preset="a4p">A4 portrait</button>
        <button data-preset="a4paysage">A4 paysage</button>
        <button data-preset="story">Story 9:16</button>
      </div>
      <div class="row wrap">
        <span class="label">Taille (px)</span>
        <input type="number" id="canvasWInput" min="100" max="4000" style="width:70px;">
        <span class="label">×</span>
        <input type="number" id="canvasHInput" min="100" max="4000" style="width:70px;">
        <button class="tool" id="applySizeBtn">Appliquer</button>
      </div>
    </div>

    <div class="panel-section" id="panel-guide">
      <label id="fileLabel" for="fileInput">Importer une image à tracer</label>
      <input type="file" id="fileInput" accept="image/*">
      <div class="row">
        <span class="label">Opacité</span>
        <input type="range" id="guideOpacity" min="0" max="100" value="40">
      </div>
      <button class="tool" id="clearGuideBtn" style="width:fit-content;">Retirer le calque guide</button>
    </div>

    <div class="panel-section" id="panel-grid">
      <div class="toggle-row">
        <input type="checkbox" id="gridToggle">
        <label for="gridToggle">Afficher la grille</label>
      </div>
      <div class="row">
        <span class="label">Espacement</span>
        <input type="range" id="gridSpacing" min="10" max="80" value="28">
      </div>
      <div class="label">Règles</div>
      <div class="choice-row">
        <button id="addGuideHBtn">+ Règle horizontale</button>
        <button id="addGuideVBtn">+ Règle verticale</button>
        <button id="clearGuidesBtn">Effacer les règles</button>
      </div>
      <div class="toggle-row">
        <input type="checkbox" id="moveGuidesToggle">
        <label for="moveGuidesToggle">Déplacer les règles (glisse près d'une ligne)</label>
      </div>
    </div>

    <div class="panel-section" id="panel-export">
      <div class="choice-row">
        <button id="exportPngBtn">PNG</button>
        <button id="exportPngTransparentBtn">PNG (fond transparent)</button>
        <button id="exportJpgBtn">JPEG</button>
        <button id="exportPdfBtn">PDF</button>
      </div>
    </div>

    <div class="panel-section" id="panel-history">
      <button class="tool" id="addSavePointBtn" style="width:fit-content;">+ Point de sauvegarde</button>
      <div id="savePointList"></div>
    </div>
    </div>
  </div>

</div>

<script>
(function(){
  const wrap = document.getElementById('canvas-wrap');
  const stage = document.getElementById('stage');
  const guideImg = document.getElementById('guideImg');
  const gridCanvas = document.getElementById('grid');
  const gctx = gridCanvas.getContext('2d');
  const previewCanvas = document.getElementById('preview');
  const pctx = previewCanvas.getContext('2d');
  const inputCanvas = document.getElementById('input');
  const layersContainer = document.getElementById('layersContainer');

  let cssW = 0, cssH = 0;

  // ---------- layers ----------
  let layers = [];
  let activeLayerId = null;
  let layerIdCounter = 1;

  function activeLayer(){ return layers.find(l => l.id === activeLayerId) || layers[layers.length-1]; }
  function getCtx(){ return activeLayer().ctx; }

  function sizeLayerCanvas(layer, preserve){
    const dpr = window.devicePixelRatio || 1;
    let snapshot = null;
    if(preserve && layer.canvas.width > 0){
      snapshot = document.createElement('canvas');
      snapshot.width = layer.canvas.width; snapshot.height = layer.canvas.height;
      snapshot.getContext('2d').drawImage(layer.canvas,0,0);
    }
    layer.canvas.width = cssW*dpr; layer.canvas.height = cssH*dpr;
    layer.ctx.setTransform(dpr,0,0,dpr,0,0);
    layer.ctx.lineCap='round'; layer.ctx.lineJoin='round';
    if(snapshot){
      layer.ctx.drawImage(snapshot,0,0,snapshot.width,snapshot.height,0,0,cssW,cssH);
    }
  }

  function addLayer(name){
    const canvas = document.createElement('canvas');
    canvas.className = 'layer-canvas';
    layersContainer.appendChild(canvas);
    const layer = { id: layerIdCounter++, name: name || ('Calque ' + (layers.length+1)), canvas, ctx: canvas.getContext('2d'), opacity:1, visible:true, blend:'normal' };
    layers.push(layer);
    sizeLayerCanvas(layer,false);
    activeLayerId = layer.id;
    renderLayersPanel();
    return layer;
  }

  function removeLayer(id){
    if(layers.length <= 1) return;
    const idx = layers.findIndex(l => l.id === id);
    if(idx < 0) return;
    layers[idx].canvas.remove();
    layers.splice(idx,1);
    if(activeLayerId === id) activeLayerId = layers[layers.length-1].id;
    renderLayersPanel();
  }

  function moveLayer(id, dir){
    const idx = layers.findIndex(l => l.id === id);
    const newIdx = idx + dir;
    if(newIdx < 0 || newIdx >= layers.length) return;
    const [layer] = layers.splice(idx,1);
    layers.splice(newIdx,0,layer);
    layers.forEach(l => layersContainer.appendChild(l.canvas));
    renderLayersPanel();
  }

  function duplicateLayer(id){
    const src = layers.find(l => l.id === id);
    if(!src) return;
    const copy = addLayer(src.name + ' copie');
    copy.ctx.drawImage(src.canvas, 0, 0, src.canvas.width, src.canvas.height, 0, 0, cssW, cssH);
    copy.opacity = src.opacity;
    copy.canvas.style.opacity = copy.opacity;
  }

  function mergeDown(id){
    const idx = layers.findIndex(l => l.id === id);
    if(idx <= 0) return;
    const top = layers[idx], below = layers[idx-1];
    below.ctx.globalAlpha = top.opacity;
    below.ctx.drawImage(top.canvas, 0, 0, top.canvas.width, top.canvas.height, 0, 0, cssW, cssH);
    below.ctx.globalAlpha = 1;
    removeLayer(top.id);
    activeLayerId = below.id;
    renderLayersPanel();
  }

  function transformActiveLayer(kind){
    const layer = activeLayer();
    const tmp = document.createElement('canvas');
    tmp.width = layer.canvas.width; tmp.height = layer.canvas.height;
    tmp.getContext('2d').drawImage(layer.canvas,0,0);
    layer.ctx.clearRect(0,0,cssW,cssH);
    layer.ctx.save();
    if(kind === 'mirrorH'){
      layer.ctx.translate(cssW,0); layer.ctx.scale(-1,1);
    } else if(kind === 'mirrorV'){
      layer.ctx.translate(0,cssH); layer.ctx.scale(1,-1);
    } else if(kind === 'rotate180'){
      layer.ctx.translate(cssW,cssH); layer.ctx.rotate(Math.PI);
    }
    layer.ctx.drawImage(tmp,0,0,tmp.width,tmp.height,0,0,cssW,cssH);
    layer.ctx.restore();
  }
  document.getElementById('mirrorHBtn').addEventListener('click', () => { pushUndo(); transformActiveLayer('mirrorH'); });
  document.getElementById('mirrorVBtn').addEventListener('click', () => { pushUndo(); transformActiveLayer('mirrorV'); });
  document.getElementById('rotate180Btn').addEventListener('click', () => { pushUndo(); transformActiveLayer('rotate180'); });

  function applyLayerFilter(kind){
    pushUndo();
    const layer = activeLayer();
    const ctx = layer.ctx, canvas = layer.canvas;
    const id = ctx.getImageData(0,0,canvas.width,canvas.height);
    const d = id.data;
    const clamp = v => v<0?0:(v>255?255:v);
    for(let i=0;i<d.length;i+=4){
      if(d[i+3] === 0) continue;
      if(kind === 'grayscale'){
        const g = 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        d[i]=d[i+1]=d[i+2]=g;
      } else if(kind === 'sepia'){
        const r=d[i], g=d[i+1], b=d[i+2];
        d[i]=clamp(r*0.393+g*0.769+b*0.189);
        d[i+1]=clamp(r*0.349+g*0.686+b*0.168);
        d[i+2]=clamp(r*0.272+g*0.534+b*0.131);
      } else if(kind === 'invert'){
        d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2];
      } else if(kind === 'contrast'){
        const f = 1.35;
        d[i]=clamp((d[i]-128)*f+128);
        d[i+1]=clamp((d[i+1]-128)*f+128);
        d[i+2]=clamp((d[i+2]-128)*f+128);
      }
    }
    ctx.putImageData(id,0,0);
  }
  document.getElementById('filterGrayBtn').addEventListener('click', () => applyLayerFilter('grayscale'));

  // ---------- zoom & pan ----------
  let zoomScale = 1, panX = 0, panY = 0;
  function applyStageTransform(){
    stage.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomScale})`;
  }
  document.getElementById('zoomInBtn').addEventListener('click', () => { zoomScale = Math.min(4, zoomScale+0.2); applyStageTransform(); });
  document.getElementById('zoomOutBtn').addEventListener('click', () => { zoomScale = Math.max(0.5, zoomScale-0.2); applyStageTransform(); });
  document.getElementById('zoomResetBtn').addEventListener('click', () => { zoomScale=1; panX=0; panY=0; applyStageTransform(); });
  wrap.addEventListener('wheel', e => {
    e.preventDefault();

    zoomScale = Math.min(4, Math.max(0.5, zoomScale*factor));
    applyStageTransform();
  }, {passive:false});

  let gestureActive = false, gLastDist = 0, gLastMid = null;
  function touchDist(t0,t1){ return Math.hypot(t1.clientX-t0.clientX, t1.clientY-t0.clientY); }
  function touchMid(t0,t1){ return {x:(t0.clientX+t1.clientX)/2, y:(t0.clientY+t1.clientY)/2}; }

  // ---------- resize ----------
  function resizeAll(preserve){
    const oldW = cssW, oldH = cssH;
    const rect = wrap.getBoundingClientRect();
    cssW = rect.width; cssH = rect.height;
    const dpr = window.devicePixelRatio || 1;

    gridCanvas.width = cssW*dpr; gridCanvas.height = cssH*dpr;
    gctx.setTransform(dpr,0,0,dpr,0,0);
    previewCanvas.width = cssW*dpr; previewCanvas.height = cssH*dpr;
    pctx.setTransform(dpr,0,0,dpr,0,0); pctx.lineCap='round'; pctx.lineJoin='round';
    inputCanvas.width = cssW*dpr; inputCanvas.height = cssH*dpr;

    layers.forEach(l => sizeLayerCanvas(l, preserve));
    goldGradientCache = null;

    if(oldW > 0 && oldH > 0){
      symCenter.x *= (cssW/oldW); symCenter.y *= (cssH/oldH);
      guidesH = guidesH.map(y => y*(cssH/oldH));
      guidesV = guidesV.map(x => x*(cssW/oldW));
    } else {

    }

  }
  window.addEventListener('resize', () => resizeAll(true));

  // ---------- canvas size / presets ----------
  function applyCanvasSize(w,h){
    wrap.style.flex = '0 0 auto';
    wrap.style.width = w+'px';
    wrap.style.height = h+'px';
    wrap.style.margin = 'auto';
    resizeAll(true);
  }
  function useFreeSize(){
    wrap.style.flex = '1';
    wrap.style.width = '';
    wrap.style.height = '';
    wrap.style.margin = '0';
    resizeAll(true);
  }
  const canvasPresets = { carre:[1,1], a4p:[210,297], a4paysage:[297,210], story:[9,16] };
  function applyPreset(key){
    if(key === 'libre'){ useFreeSize(); return; }
    const [rw,rh] = canvasPresets[key];
    const avail = wrap.getBoundingClientRect();
    const availW = avail.width*0.96, availH = avail.height*0.96;
    let w = availW, h = w*(rh/rw);
    if(h > availH){ h = availH; w = h*(rw/rh); }
    applyCanvasSize(Math.round(w), Math.round(h));
  }

  // ---------- state ----------
  let tool = 'brush';
  let currentColor = '#1F2421';
  let currentSize = 4;
  let nibAngleDeg = 45;
  let symCount = 1;
  let symMirror = false;
  let symShowAxes = true;
  let gridOn = false;
  let gridSpacing = 28;
  let guideOpacity = 0.4;
  let brushType = 'round';
  let brushOpacity = 1;
  let shapeType = 'line';
  let shapeFill = false;
  let shapeStart = null;
  let bgColor = '#FFFFFF';
  let secondaryColor = '#FFFFFF';
  let colorTarget = 'primary';
  let recentColors = [];
  let symCenter = {x:0,y:0};
  let movingSymCenter = false;
  let guidesH = [], guidesV = [];
  let movingGuides = false;
  let draggingGuide = null;

  let drawing = false;
  let lastPt = null;

  let undoStack = [], redoStack = [];
  const MAX_HISTORY = 25;

  function pushUndo(){
    try{
      const l = activeLayer();
      undoStack.push({ layerId: l.id, dataURL: l.canvas.toDataURL() });
      if(undoStack.length > MAX_HISTORY) undoStack.shift();
      redoStack = [];
    }catch(e){}
  }
  function restoreEntry(entry){
    const layer = layers.find(l => l.id === entry.layerId);
    if(!layer) return;
    const img = new Image();
    img.onload = () => {
      layer.ctx.clearRect(0,0,cssW,cssH);
      layer.ctx.drawImage(img,0,0);
    };
    img.src = entry.dataURL;
  }

  // ---------- grid & axes ----------
  function drawGrid(){
    gctx.clearRect(0,0,cssW,cssH);
    if(gridOn){
      gctx.strokeStyle = 'rgba(31,36,33,0.14)';
      gctx.lineWidth = 1;
      for(let x = 0; x <= cssW; x += gridSpacing){
        gctx.beginPath(); gctx.moveTo(x,0); gctx.lineTo(x,cssH); gctx.stroke();
      }
      for(let y = 0; y <= cssH; y += gridSpacing){
        gctx.beginPath(); gctx.moveTo(0,y); gctx.lineTo(cssW,y); gctx.stroke();
      }
    }
    guidesH.forEach(y => {
      gctx.strokeStyle = 'rgba(62,92,118,0.55)'; gctx.lineWidth = 1; gctx.setLineDash([6,4]);
      gctx.beginPath(); gctx.moveTo(0,y); gctx.lineTo(cssW,y); gctx.stroke(); gctx.setLineDash([]);
    });
    guidesV.forEach(x => {
      gctx.strokeStyle = 'rgba(62,92,118,0.55)'; gctx.lineWidth = 1; gctx.setLineDash([6,4]);
      gctx.beginPath(); gctx.moveTo(x,0); gctx.lineTo(x,cssH); gctx.stroke(); gctx.setLineDash([]);
    });
    if(symCount > 1 && symShowAxes){
      const cx = symCenter.x, cy = symCenter.y;
      gctx.strokeStyle = 'rgba(181,83,60,0.35)';
      gctx.lineWidth = 1;
      const R = Math.max(cssW,cssH);
      for(let k=0;k<symCount;k++){
        const a = k*(2*Math.PI/symCount);
        gctx.beginPath(); gctx.moveTo(cx,cy); gctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); gctx.stroke();
      }
      gctx.fillStyle = 'rgba(181,83,60,0.6)';
      gctx.beginPath(); gctx.arc(cx,cy,3,0,Math.PI*2); gctx.fill();
    }
  }

  // ---------- symmetry transforms ----------
  function getTransforms(){
    const list = [];
    const n = symCount;
    for(let k=0;k<n;k++){
      const angle = k*(2*Math.PI/n);
      list.push({angle, mirror:false});
      if(symMirror) list.push({angle, mirror:true});
    }
    return list;
  }
  function applyTransform(x,y,t){
    const cx = symCenter.x, cy = symCenter.y;
    let dx = x-cx, dy = y-cy;
    if(t.mirror) dx = -dx;
    const cos = Math.cos(t.angle), sin = Math.sin(t.angle);
    const rx = dx*cos - dy*sin, ry = dx*sin + dy*cos;
    return {x: cx+rx, y: cy+ry};
  }
  function transformAngle(baseRad, t){
    let a = t.mirror ? (Math.PI - baseRad) : baseRad;
    return a + t.angle;
  }

  // ---------- pointer helpers ----------
  function pointerPos(e){
    const rect = inputCanvas.getBoundingClientRect();
    let clientX, clientY;
    if(e.touches && e.touches.length){ clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    else { clientX = e.clientX; clientY = e.clientY; }
    return { x:(clientX-rect.left)/zoomScale, y:(clientY-rect.top)/zoomScale };
  }

  // ---------- drawing primitives ----------
  function prepareContext(){
    const ctx = getCtx();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.filter = 'none';
    if(tool === 'eraser'){
      ctx.globalCompositeOperation = 'destination-out';
    } else if(tool === 'brush'){
      ctx.globalAlpha = brushOpacity;
      if(brushType === 'soft'){
        ctx.filter = 'blur(' + Math.max(currentSize*0.25,1) + 'px)';
      } else if(brushType === 'marker'){
        ctx.globalCompositeOperation = 'multiply';
        ctx.globalAlpha = Math.min(brushOpacity, 0.6);
      }
    }
  }
  function resetContext(){
    const ctx = getCtx();
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.filter = 'none';
  }

  function drawSegmentBrush(p0,p1){
    if(brushType === 'grain') return drawSegmentGrain(p0,p1);
    if(brushType === 'hatch') return drawSegmentHatch(p0,p1);
    if(brushType === 'watercolor') return drawSegmentWatercolor(p0,p1);
    if(brushType === 'pattern') return drawSegmentPattern(p0,p1);
    const ctx = getCtx();
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  }

  function drawSegmentGrain(p0,p1){
    const ctx = getCtx();
    ctx.save();
    ctx.globalAlpha = brushOpacity;
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    // subtract random speckles to break up the edge like paper grain
    const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const steps = Math.max(1, Math.floor(dist/1.5));
    ctx.globalCompositeOperation = 'destination-out';
    for(let i=0;i<steps;i++){
      if(Math.random() < 0.55){
        const t = i/steps;
        const x = p0.x + (p1.x-p0.x)*t + (Math.random()-0.5)*currentSize*0.7;
        const y = p0.y + (p1.y-p0.y)*t + (Math.random()-0.5)*currentSize*0.7;
        ctx.globalAlpha = (0.15+Math.random()*0.3) * brushOpacity;
        ctx.beginPath(); ctx.arc(x,y, Math.random()*currentSize*0.18, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSegmentHatch(p0,p1){
    const ctx = getCtx();
    ctx.save();
    ctx.globalAlpha = brushOpacity;
    const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const angle = Math.atan2(p1.y-p0.y, p1.x-p0.x);
    const perp = angle + Math.PI/2;
    const spacing = Math.max(3, currentSize*0.45);
    const steps = Math.max(1, Math.floor(dist/spacing));
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = Math.max(1, currentSize*0.12);
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const x = p0.x + (p1.x-p0.x)*t;
      const y = p0.y + (p1.y-p0.y)*t;
      const len = currentSize * (0.7+Math.random()*0.5);
      const jitter = (Math.random()-0.5)*0.35;
      const a = perp+jitter;
      ctx.beginPath();
      ctx.moveTo(x-Math.cos(a)*len/2, y-Math.sin(a)*len/2);
      ctx.lineTo(x+Math.cos(a)*len/2, y+Math.sin(a)*len/2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawSegmentWatercolor(p0,p1){
    const ctx = getCtx();
    ctx.save();
    ctx.globalAlpha = 0.13*brushOpacity;
    ctx.filter = 'blur(' + Math.max(currentSize*0.35,2) + 'px)';
    ctx.strokeStyle = currentColor;
    for(let i=0;i<3;i++){
      const jitter = currentSize*0.15;
      const ox = (Math.random()-0.5)*jitter, oy = (Math.random()-0.5)*jitter;
      ctx.lineWidth = currentSize*(0.8+Math.random()*0.6);
      ctx.beginPath(); ctx.moveTo(p0.x+ox,p0.y+oy); ctx.lineTo(p1.x+ox,p1.y+oy); ctx.stroke();
    }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.07*brushOpacity;
    ctx.filter = 'none';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize*1.15;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    ctx.restore();
  }

  function drawSegmentPattern(p0,p1){
    const ctx = getCtx();
    const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const spacing = Math.max(4, currentSize*1.1);
    const steps = Math.max(1, Math.floor(dist/spacing));
    ctx.save();
    ctx.globalAlpha = brushOpacity;
    ctx.fillStyle = currentColor;
    for(let i=0;i<=steps;i++){
      const t = i/steps;
      const x = p0.x + (p1.x-p0.x)*t, y = p0.y + (p1.y-p0.y)*t;
      ctx.save();
      ctx.translate(x,y);
      ctx.rotate(Math.random()*Math.PI*2);
      const s = currentSize*0.5;
      ctx.beginPath();
      ctx.moveTo(0,-s);
      ctx.quadraticCurveTo(s*0.4,0,0,s);
      ctx.quadraticCurveTo(-s*0.4,0,0,-s);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }
  function drawSegmentEraser(p0,p1){
    const ctx = getCtx();
    ctx.strokeStyle = 'rgba(0,0,0,1)';
    ctx.lineWidth = currentSize*2.2;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
  }

  let goldGradientCache = null;
  function getGoldGradient(){
    if(!goldGradientCache){
      const g = getCtx().createLinearGradient(0,0,cssW,cssH);
      g.addColorStop(0,'#8a6512'); g.addColorStop(0.35,'#dcae42');
      g.addColorStop(0.5,'#fff6cf'); g.addColorStop(0.65,'#dcae42'); g.addColorStop(1,'#8a6512');
      goldGradientCache = g;
    }
    return goldGradientCache;
  }
  function drawSegmentGold(p0,p1){
    const ctx = getCtx();
    ctx.strokeStyle = getGoldGradient();
    ctx.lineWidth = currentSize;
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    if(Math.random() < 0.1){
      ctx.fillStyle = 'rgba(255,250,220,0.7)';
      const rx = p1.x + (Math.random()-0.5)*currentSize*0.6;
      const ry = p1.y + (Math.random()-0.5)*currentSize*0.6;
      ctx.beginPath(); ctx.arc(rx,ry, Math.max(currentSize*0.09,0.5), 0, Math.PI*2); ctx.fill();
    }
  }

  function drawNib(x,y,angleRad){
    const ctx = getCtx();
    const nibLen = Math.max(currentSize*2.2, 6);
    const thickness = Math.max(currentSize*0.55, 1.2);
    ctx.save(); ctx.translate(x,y); ctx.rotate(angleRad);
    ctx.fillStyle = currentColor;
    ctx.fillRect(-nibLen/2, -thickness/2, nibLen, thickness);
    ctx.restore();
  }
  function drawQuillSegment(p0,p1,t){
    const dist = Math.hypot(p1.x-p0.x, p1.y-p0.y);
    const steps = Math.max(1, Math.ceil(dist/2));
    const baseAngle = nibAngleDeg*Math.PI/180;
    const angle = transformAngle(baseAngle, t);
    for(let i=1;i<=steps;i++){
      const x = p0.x + (p1.x-p0.x)*(i/steps);
      const y = p0.y + (p1.y-p0.y)*(i/steps);
      drawNib(x,y,angle);
    }
  }

  // ---------- shapes ----------
  function drawShapeOn(ctx, p0, p1, fill){
    const transforms = getTransforms();
    const cx0 = (p0.x+p1.x)/2, cy0 = (p0.y+p1.y)/2;
    const w = Math.abs(p1.x-p0.x), h = Math.abs(p1.y-p0.y);
    transforms.forEach(t => {
      if(shapeType === 'line'){
        const a = applyTransform(p0.x,p0.y,t);
        const b = applyTransform(p1.x,p1.y,t);
        ctx.strokeStyle = currentColor; ctx.lineWidth = currentSize;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
        return;
      }
      const center = applyTransform(cx0,cy0,t);
      ctx.save(); ctx.translate(center.x, center.y); ctx.rotate(t.angle);
      ctx.strokeStyle = currentColor; ctx.fillStyle = currentColor; ctx.lineWidth = currentSize;
      if(shapeType === 'rect'){
        if(fill) ctx.fillRect(-w/2,-h/2,w,h); else ctx.strokeRect(-w/2,-h/2,w,h);
      } else if(shapeType === 'circle'){
        ctx.beginPath(); ctx.ellipse(0,0,w/2,h/2,0,0,Math.PI*2);
        if(fill) ctx.fill(); else ctx.stroke();
      }
      ctx.restore();
    });
  }
  function previewShape(p0,p1){
    pctx.clearRect(0,0,cssW,cssH);
    pctx.globalAlpha = 0.85;
    drawShapeOn(pctx, p0, p1, shapeFill);
    pctx.globalAlpha = 1;
  }
  function finalizeShape(p0,p1){
    resetContext();
    drawShapeOn(getCtx(), p0, p1, shapeFill);
    pctx.clearRect(0,0,cssW,cssH);
  }

  // ---------- gradient ----------
  function paintGradient(ctx, p0, p1){
    const g = ctx.createLinearGradient(p0.x,p0.y,p1.x,p1.y);
    g.addColorStop(0, currentColor);
    g.addColorStop(1, secondaryColor);
    ctx.fillStyle = g;
    ctx.fillRect(0,0,cssW,cssH);
  }
  function previewGradient(p0,p1){
    pctx.clearRect(0,0,cssW,cssH);
    pctx.globalAlpha = 0.85;
    paintGradient(pctx, p0, p1);
    pctx.globalAlpha = 1;
  }
  function finalizeGradient(p0,p1){
    resetContext();
    paintGradient(getCtx(), p0, p1);
    pctx.clearRect(0,0,cssW,cssH);
  }

  // ---------- eyedropper ----------
  function pickColor(x,y){
    const dpr = window.devicePixelRatio || 1;
    const tmp = document.createElement('canvas');
    tmp.width = cssW*dpr; tmp.height = cssH*dpr;
    const tctx = tmp.getContext('2d');
    layers.forEach(l => {
      if(!l.visible) return;
      tctx.globalAlpha = l.opacity;
      tctx.drawImage(l.canvas,0,0);
      tctx.globalAlpha = 1;
    });
    const px = Math.min(tmp.width-1, Math.max(0, Math.floor(x*dpr)));
    const py = Math.min(tmp.height-1, Math.max(0, Math.floor(y*dpr)));
    const d = tctx.getImageData(px,py,1,1).data;
    if(d[3] === 0) return;
    colorTarget = 'primary';
    setColor(rgbToHex(d[0],d[1],d[2]));
  }

  // ---------- flood fill ----------
  function hexToRgb(hex){
    const h = hex.replace('#','');
    const v = h.length === 3 ? h.split('').map(c=>c+c).join('') : h;
    const num = parseInt(v,16);
    return [(num>>16)&255, (num>>8)&255, num&255, 255];
  }
  function floodFill(cssX,cssY){
    const dpr = window.devicePixelRatio || 1;
    const ctx = getCtx();
    const canvas = activeLayer().canvas;
    const w = canvas.width, h = canvas.height;
    const x0 = Math.floor(cssX*dpr), y0 = Math.floor(cssY*dpr);
    if(x0 < 0 || y0 < 0 || x0 >= w || y0 >= h) return;
    const imgData = ctx.getImageData(0,0,w,h);
    const data = imgData.data;
    const startIdx = (y0*w+x0)*4;
    const startColor = [data[startIdx],data[startIdx+1],data[startIdx+2],data[startIdx+3]];
    const fill = hexToRgb(currentColor);
    if(startColor[0]===fill[0] && startColor[1]===fill[1] && startColor[2]===fill[2] && startColor[3]===fill[3]) return;
    const tolerance = 40;
    function matches(idx){
      const dr=data[idx]-startColor[0], dg=data[idx+1]-startColor[1], db=data[idx+2]-startColor[2], da=data[idx+3]-startColor[3];
      return (dr*dr+dg*dg+db*db+da*da) <= tolerance*tolerance;
    }
    const stack = [[x0,y0]];
    let guard = 0; const maxIter = w*h*2;
    while(stack.length && guard < maxIter){
      guard++;
      let [x,y] = stack.pop();
      let idx = (y*w+x)*4;
      if(!matches(idx)) continue;
      let xl = x; while(xl > 0 && matches((y*w+(xl-1))*4)) xl--;
      let xr = x; while(xr < w-1 && matches((y*w+(xr+1))*4)) xr++;
      let spanAbove=false, spanBelow=false;
      for(let xi=xl; xi<=xr; xi++){
        const pIdx=(y*w+xi)*4;
        data[pIdx]=fill[0]; data[pIdx+1]=fill[1]; data[pIdx+2]=fill[2]; data[pIdx+3]=fill[3];
        if(y>0){
          const m=matches(((y-1)*w+xi)*4);
          if(!spanAbove && m){ stack.push([xi,y-1]); spanAbove=true; } else if(spanAbove && !m) spanAbove=false;
        }
        if(y<h-1){
          const m=matches(((y+1)*w+xi)*4);
          if(!spanBelow && m){ stack.push([xi,y+1]); spanBelow=true; } else if(spanBelow && !m) spanBelow=false;
        }
      }
    }
    ctx.putImageData(imgData,0,0);
  }

  // ---------- pointer events ----------
  function startDraw(e){
    const p = pointerPos(e);

    if(movingSymCenter){ symCenter = {x:p.x,y:p.y}; drawing = true; lastPt = p; drawGrid(); return; }
    if(movingGuides){
      const threshold = 12;
      let nearestH = -1, nearestV = -1, bestHd = threshold, bestVd = threshold;
      guidesH.forEach((y,i) => { const d = Math.abs(y-p.y); if(d < bestHd){ bestHd=d; nearestH=i; } });
      guidesV.forEach((x,i) => { const d = Math.abs(x-p.x); if(d < bestVd){ bestVd=d; nearestV=i; } });
      draggingGuide = null;
      if(nearestH>=0 && bestHd<=bestVd) draggingGuide = {type:'h', idx:nearestH};
      else if(nearestV>=0) draggingGuide = {type:'v', idx:nearestV};
      drawing = true; lastPt = p;
      return;
    }

    if(tool === 'eyedropper'){ pickColor(p.x,p.y); return; }
    if(tool === 'fill'){ pushUndo(); floodFill(p.x,p.y); return; }
    if(tool === 'shape'){ pushUndo(); shapeStart = p; lastPt = p; drawing = true; return; }
    if(tool === 'gradient'){ pushUndo(); shapeStart = p; lastPt = p; drawing = true; return; }

    prepareContext();
    drawing = true; lastPt = p;
    pushUndo();

    const transforms = getTransforms();
    transforms.forEach(t => {
      const tp = applyTransform(p.x,p.y,t);
      const ctx = getCtx();
      if(tool === 'quill'){
        drawNib(tp.x,tp.y, transformAngle(nibAngleDeg*Math.PI/180, t));
      } else if(tool === 'gold'){
        ctx.fillStyle = getGoldGradient();
        ctx.beginPath(); ctx.arc(tp.x,tp.y,currentSize/2,0,Math.PI*2); ctx.fill();
      } else if(tool === 'brush' && ['grain','hatch','watercolor','pattern'].includes(brushType)){
        drawSegmentBrush(tp,tp);
      } else {
        ctx.fillStyle = currentColor;
        ctx.beginPath(); ctx.arc(tp.x,tp.y,currentSize/2,0,Math.PI*2); ctx.fill();
      }
    });
  }

  function moveDraw(e){
    if(!drawing) return;
    const p = pointerPos(e);
    if(movingSymCenter){ symCenter = {x:p.x,y:p.y}; drawGrid(); lastPt = p; return; }
    if(movingGuides){
      if(draggingGuide){
        if(draggingGuide.type === 'h') guidesH[draggingGuide.idx] = p.y;
        else guidesV[draggingGuide.idx] = p.x;
        drawGrid();
      }
      lastPt = p;
      return;
    }
    if(tool === 'shape'){ previewShape(shapeStart, p); lastPt = p; return; }
    if(tool === 'gradient'){ previewGradient(shapeStart, p); lastPt = p; return; }
    const transforms = getTransforms();
    transforms.forEach(t => {
      const p0 = applyTransform(lastPt.x,lastPt.y,t);
      const p1 = applyTransform(p.x,p.y,t);
      if(tool === 'quill') drawQuillSegment(p0,p1,t);
      else if(tool === 'gold') drawSegmentGold(p0,p1);
      else if(tool === 'eraser') drawSegmentEraser(p0,p1);
      else drawSegmentBrush(p0,p1);
    });
    lastPt = p;
  }

  function endDraw(){
    if(movingSymCenter || movingGuides){ draggingGuide = null; drawing = false; lastPt = null; return; }
    if(tool === 'shape' && shapeStart && lastPt) finalizeShape(shapeStart, lastPt);
    if(tool === 'gradient' && shapeStart && lastPt) finalizeGradient(shapeStart, lastPt);
    shapeStart = null; drawing = false; lastPt = null;
  }

  // mouse (desktop)
  inputCanvas.addEventListener('mousedown', e => { e.preventDefault(); startDraw(e); });
  inputCanvas.addEventListener('mousemove', e => {
    if(drawing){ moveDraw(e); }
    else {
      const p = pointerPos(e);
      pctx.clearRect(0,0,cssW,cssH);
      if(['brush','quill','gold','eraser'].includes(tool)){
        pctx.beginPath();
        pctx.arc(p.x,p.y, currentSize/2, 0, Math.PI*2);
        pctx.strokeStyle = 'rgba(31,36,33,0.55)';
        pctx.lineWidth = 1;
        pctx.stroke();
      }
    }
  });
  inputCanvas.addEventListener('mouseleave', () => { if(!drawing) pctx.clearRect(0,0,cssW,cssH); });
  window.addEventListener('mouseup', endDraw);

  // touch (mobile) — one finger draws, two fingers pan/zoom
  inputCanvas.addEventListener('touchstart', e => {
    if(e.touches.length >= 2){
      e.preventDefault();
      gestureActive = true; drawing = false;
      gLastDist = touchDist(e.touches[0], e.touches[1]);
      gLastMid = touchMid(e.touches[0], e.touches[1]);
      return;
    }
    e.preventDefault();
    startDraw(e);
  }, {passive:false});

  inputCanvas.addEventListener('touchmove', e => {
    if(e.touches.length >= 2){
      e.preventDefault();
      const d = touchDist(e.touches[0], e.touches[1]);
      const m = touchMid(e.touches[0], e.touches[1]);
      zoomScale = Math.min(4, Math.max(0.5, zoomScale*(d/gLastDist)));
      panX += (m.x-gLastMid.x); panY += (m.y-gLastMid.y);
      gLastDist = d; gLastMid = m;
      applyStageTransform();
      return;
    }
    if(gestureActive) return;
    e.preventDefault();
    moveDraw(e);
  }, {passive:false});

  inputCanvas.addEventListener('touchend', e => {
    if(e.touches.length === 0){
      gestureActive = false;
      endDraw();
    } else if(e.touches.length === 1 && gestureActive){
      gestureActive = false; drawing = false; lastPt = null;
    }
  });
  inputCanvas.addEventListener('touchcancel', () => { gestureActive=false; drawing=false; lastPt=null; });

  // ---------- tool buttons ----------
  const toolButtons = document.querySelectorAll('button.tool[data-tool]');
  toolButtons.forEach(b => {
    b.addEventListener('click', () => {
      tool = b.dataset.tool;
      toolButtons.forEach(x => { x.classList.remove('active'); x.classList.remove('gold-active'); });
      b.classList.add(tool === 'gold' ? 'gold-active' : 'active');
    });
  });

  // ---------- color: swatches ----------
  const swatchesWrap = document.getElementById('swatches');
  const currentColorBtn = document.getElementById('currentColorBtn');
  let palette = ['#1F2421','#FFFFFF','#B5533C','#8B2E2E','#3E5C76','#1B3A6B','#5C6B57','#2E5C3E','#D9A441','#C9982F','#6B3FA0','#7A4B2A'];

  function renderSwatches(){
    swatchesWrap.innerHTML = '';
    palette.forEach(c => {
      const b = document.createElement('button');
      b.className = 'swatch' + (c.toLowerCase() === currentColor.toLowerCase() ? ' active' : '');
      b.style.background = c;
      b.addEventListener('click', () => { setColor(c); });
      swatchesWrap.appendChild(b);
    });
  }
  document.getElementById('addSwatchBtn').addEventListener('click', () => {
    if(!palette.includes(currentColor)){
      palette.push(currentColor);
      if(palette.length > 24) palette.shift();
      renderSwatches();
    }
  });

  // ---------- color: HSV wheel ----------
  const svCanvas = document.getElementById('svCanvas');
  const svCtx = svCanvas.getContext('2d');
  const hueCanvas = document.getElementById('hueCanvas');
  const hueCtx = hueCanvas.getContext('2d');
  const hexInput = document.getElementById('hexInput');
  let hue=0, sat=0, val=0.12; // initial derived below from currentColor

  function hsvToRgb(h,s,v){
    const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
    else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else {r=c;g=0;b=x;}
    return [Math.round((r+m)*255), Math.round((g+m)*255), Math.round((b+m)*255)];
  }
  function rgbToHsv(r,g,b){
    r/=255; g/=255; b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
    let h=0;
    if(d!==0){
      if(max===r) h = 60*(((g-b)/d)%6);
      else if(max===g) h = 60*((b-r)/d+2);
      else h = 60*((r-g)/d+4);
    }
    if(h<0) h+=360;
    return [h, max===0?0:d/max, max];
  }
  function rgbToHex(r,g,b){ return '#' + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join(''); }

  function drawSVSquare(){
    const w=svCanvas.width, h=svCanvas.height;
    const base = hsvToRgb(hue,1,1);
    svCtx.fillStyle = `rgb(${base[0]},${base[1]},${base[2]})`;
    svCtx.fillRect(0,0,w,h);
    const gw = svCtx.createLinearGradient(0,0,w,0);
    gw.addColorStop(0,'rgba(255,255,255,1)'); gw.addColorStop(1,'rgba(255,255,255,0)');
    svCtx.fillStyle = gw; svCtx.fillRect(0,0,w,h);
    const gb = svCtx.createLinearGradient(0,0,0,h);
    gb.addColorStop(0,'rgba(0,0,0,0)'); gb.addColorStop(1,'rgba(0,0,0,1)');
    svCtx.fillStyle = gb; svCtx.fillRect(0,0,w,h);
    const cx = sat*w, cy=(1-val)*h;
    svCtx.beginPath(); svCtx.arc(cx,cy,6,0,Math.PI*2);
    svCtx.strokeStyle = val>0.6 ? '#1F2421' : '#F2ECDC'; svCtx.lineWidth=2; svCtx.stroke();
  }
  function drawHueStrip(){
    const w=hueCanvas.width, h=hueCanvas.height;
    const grad = hueCtx.createLinearGradient(0,0,w,0);
    for(let i=0;i<=360;i+=30) grad.addColorStop(i/360, `hsl(${i},100%,50%)`);
    hueCtx.fillStyle = grad; hueCtx.fillRect(0,0,w,h);
    const x = (hue/360)*w;
    hueCtx.strokeStyle = '#fff'; hueCtx.lineWidth=3;
    hueCtx.beginPath(); hueCtx.moveTo(x,0); hueCtx.lineTo(x,h); hueCtx.stroke();
    hueCtx.strokeStyle = 'rgba(0,0,0,0.4)'; hueCtx.lineWidth=1;
    hueCtx.beginPath(); hueCtx.moveTo(x,0); hueCtx.lineTo(x,h); hueCtx.stroke();
  }

  function setColor(hex){
    if(colorTarget === 'secondary'){ secondaryColor = hex; }
    else { currentColor = hex; }
    const rgb = hexToRgb(hex);
    [hue,sat,val] = rgbToHsv(rgb[0],rgb[1],rgb[2]);
    pushRecent(hex);
    refreshColorUI();
  }
  function syncFromHSV(){
    const [r,g,b] = hsvToRgb(hue,sat,val);
    const hex = rgbToHex(r,g,b);
    if(colorTarget === 'secondary'){ secondaryColor = hex; } else { currentColor = hex; }
    pushRecent(hex);
    refreshColorUI();
  }
  function pushRecent(hex){
    recentColors = recentColors.filter(c => c.toLowerCase() !== hex.toLowerCase());
    recentColors.unshift(hex);
    if(recentColors.length > 12) recentColors.pop();
    renderRecent();
  }
  function renderRecent(){
    const wrap = document.getElementById('recentSwatches');
    wrap.innerHTML = '';
    recentColors.forEach(c => {
      const b = document.createElement('button');
      b.className = 'swatch';
      b.style.background = c;
      b.addEventListener('click', () => setColor(c));
      wrap.appendChild(b);
    });
  }
  function refreshColorUI(){
    drawSVSquare(); drawHueStrip();
    hexInput.value = colorTarget === 'secondary' ? secondaryColor : currentColor;
    currentColorBtn.style.background = currentColor;
    secondaryColorBtn.style.background = secondaryColor;
    currentColorBtn.classList.toggle('target', colorTarget === 'primary');
    secondaryColorBtn.classList.toggle('target', colorTarget === 'secondary');
    renderSwatches();
    renderHarmonies();
  }

  function renderHarmonies(){
    const wrapEl = document.getElementById('harmonySwatches');
    wrapEl.innerHTML = '';
    const offsets = [180, 120, -120, 30, -30];
    offsets.forEach(off => {
      const h = ((hue+off)%360+360)%360;
      const [r,g,b] = hsvToRgb(h, Math.max(sat,0.5), Math.max(val,0.6));
      const hex = rgbToHex(r,g,b);
      const b2 = document.createElement('button');
      b2.className = 'swatch';
      b2.style.background = hex;
      b2.addEventListener('click', () => setColor(hex));
      wrapEl.appendChild(b2);
    });
  }

  function enableDrag(el, handler){
    let active = false;
    el.addEventListener('mousedown', e => { active=true; handler(e); });
    window.addEventListener('mousemove', e => { if(active) handler(e); });
    window.addEventListener('mouseup', () => active=false);
    el.addEventListener('touchstart', e => { active=true; handler(e); e.preventDefault(); }, {passive:false});
    el.addEventListener('touchmove', e => { if(active){ handler(e); e.preventDefault(); } }, {passive:false});
    el.addEventListener('touchend', () => active=false);
  }
  function svHandler(e){
    const rect = svCanvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    const cy = e.touches ? e.touches[0].clientY : e.clientY;
    sat = Math.min(1, Math.max(0, (cx-rect.left)/rect.width));
    val = 1 - Math.min(1, Math.max(0, (cy-rect.top)/rect.height));
    drawSVSquare();
    syncFromHSV();
  }
  function hueHandler(e){
    const rect = hueCanvas.getBoundingClientRect();
    const cx = e.touches ? e.touches[0].clientX : e.clientX;
    hue = Math.min(1, Math.max(0, (cx-rect.left)/rect.width)) * 360;
    drawHueStrip();
    syncFromHSV();
  }
  enableDrag(svCanvas, svHandler);
  enableDrag(hueCanvas, hueHandler);

  hexInput.addEventListener('change', e => {
    let v = e.target.value.trim();
    if(!v.startsWith('#')) v = '#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)) setColor(v);
    else hexInput.value = currentColor;
  });

  currentColorBtn.addEventListener('click', () => {
    colorTarget = 'primary';
    refreshColorUI();
    panelWrap.classList.add('open'); settingsToggle.classList.add('open');
    ptabs.forEach(x=>x.classList.remove('active'));
    psections.forEach(x=>x.classList.remove('active'));
    document.querySelector('.ptab[data-panel="color"]').classList.add('active');
    document.getElementById('panel-color').classList.add('active');
  });
  const secondaryColorBtn = document.getElementById('secondaryColorBtn');
  secondaryColorBtn.addEventListener('click', () => {
    colorTarget = 'secondary';
    refreshColorUI();
    panelWrap.classList.add('open'); settingsToggle.classList.add('open');
    ptabs.forEach(x=>x.classList.remove('active'));
    psections.forEach(x=>x.classList.remove('active'));
    document.querySelector('.ptab[data-panel="color"]').classList.add('active');
    document.getElementById('panel-color').classList.add('active');
  });
  document.getElementById('swapColorsBtn').addEventListener('click', () => {
    const t = currentColor; currentColor = secondaryColor; secondaryColor = t;
    refreshColorUI();
  });

  // ---------- size ----------
  const sizeRange = document.getElementById('sizeRange');
  const sizeLabel = document.getElementById('sizeLabel');
  sizeRange.addEventListener('input', e => { currentSize = parseInt(e.target.value,10); sizeLabel.textContent = 'Taille ' + currentSize; });

  // ---------- undo / redo ----------
  document.getElementById('undoBtn').addEventListener('click', () => {
    if(undoStack.length === 0) return;
    const l = activeLayer();
    redoStack.push({ layerId:l.id, dataURL:l.canvas.toDataURL() });
    restoreEntry(undoStack.pop());
  });
  document.getElementById('redoBtn').addEventListener('click', () => {
    if(redoStack.length === 0) return;
    const l = activeLayer();
    undoStack.push({ layerId:l.id, dataURL:l.canvas.toDataURL() });
    restoreEntry(redoStack.pop());
  });
  document.getElementById('clearBtn').addEventListener('click', () => {
    pushUndo();
    getCtx().clearRect(0,0,cssW,cssH);
  });

  // ---------- save / export ----------
  function exportImage(format, transparent){
    const dpr = window.devicePixelRatio || 1;
    const out = document.createElement('canvas');
    out.width = cssW*dpr; out.height = cssH*dpr;
    const octx = out.getContext('2d');
    if(!transparent){
      octx.fillStyle = bgColor; octx.fillRect(0,0,out.width,out.height);
      if(guideImg.style.display !== 'none' && guideImg.src){
        octx.globalAlpha = guideOpacity;
        octx.drawImage(guideImg,0,0,out.width,out.height);
        octx.globalAlpha = 1;
      }
    }
    layers.forEach(l => {
      if(!l.visible) return;
      octx.globalAlpha = l.opacity;
      octx.globalCompositeOperation = (l.blend && l.blend !== 'normal') ? l.blend : 'source-over';
      octx.drawImage(l.canvas,0,0);
      octx.globalAlpha = 1;
      octx.globalCompositeOperation = 'source-over';
    });
    const link = document.createElement('a');
    if(format === 'jpeg'){
      link.download = 'dessin.jpg';
      link.href = out.toDataURL('image/jpeg', 0.92);
    } else {
      link.download = transparent ? 'dessin-transparent.png' : 'dessin.png';
      link.href = out.toDataURL('image/png');
    }
    link.click();
  }
  document.getElementById('saveBtn').addEventListener('click', () => {
    panelWrap.classList.add('open'); settingsToggle.classList.add('open');
    ptabs.forEach(x=>x.classList.remove('active'));
    psections.forEach(x=>x.classList.remove('active'));
    document.querySelector('.ptab[data-panel="export"]').classList.add('active');
    document.getElementById('panel-export').classList.add('active');
  });
  document.getElementById('exportPngBtn').addEventListener('click', () => exportImage('png', false));
  document.getElementById('exportPngTransparentBtn').addEventListener('click', () => exportImage('png', true));
  document.getElementById('exportJpgBtn').addEventListener('click', () => exportImage('jpeg', false));

  function exportPDF(){
    if(!window.jspdf){ alert('Le module PDF se charge encore, réessaie dans un instant.'); return; }
    const dpr = window.devicePixelRatio || 1;
    const out = document.createElement('canvas');
    out.width = cssW*dpr; out.height = cssH*dpr;
    const octx = out.getContext('2d');
    octx.fillStyle = bgColor; octx.fillRect(0,0,out.width,out.height);
    layers.forEach(l => {
      if(!l.visible) return;
      octx.globalAlpha = l.opacity;
      octx.globalCompositeOperation = (l.blend && l.blend !== 'normal') ? l.blend : 'source-over';
      octx.drawImage(l.canvas,0,0);
      octx.globalAlpha = 1;
      octx.globalCompositeOperation = 'source-over';
    });
    const imgData = out.toDataURL('image/jpeg', 0.92);
    const { jsPDF } = window.jspdf;
    const orientation = out.width >= out.height ? 'landscape' : 'portrait';
    const pdf = new jsPDF({ orientation, unit:'px', format:[out.width,out.height] });
    pdf.addImage(imgData, 'JPEG', 0, 0, out.width, out.height);
    pdf.save('dessin.pdf');
  }
  document.getElementById('exportPdfBtn').addEventListener('click', exportPDF);

  // ---------- named save points ----------
  let savePoints = [];
  function captureSavePoint(){
    const name = window.prompt('Nom du point de sauvegarde', 'Étape ' + (savePoints.length+1));
    if(!name) return;
    const snap = layers.map(l => ({ name:l.name, dataURL:l.canvas.toDataURL(), opacity:l.opacity, visible:l.visible, blend:l.blend||'normal' }));
    savePoints.push({ name, snap });
    renderSavePoints();
  }
  function restoreSavePoint(idx){
    const sp = savePoints[idx];
    if(!sp) return;
    layers.slice().forEach(l => l.canvas.remove());
    layers = [];
    sp.snap.forEach(entry => {
      const layer = addLayer(entry.name);
      layer.opacity = entry.opacity; layer.visible = entry.visible; layer.blend = entry.blend;
      layer.canvas.style.opacity = layer.opacity;
      layer.canvas.style.display = layer.visible ? 'block' : 'none';
      layer.canvas.style.mixBlendMode = layer.blend === 'normal' ? 'normal' : layer.blend;
      const img = new Image();
      img.onload = () => { layer.ctx.drawImage(img,0,0,img.width,img.height,0,0,cssW,cssH); };
      img.src = entry.dataURL;
    });
    renderLayersPanel();
  }
  function renderSavePoints(){
    const list = document.getElementById('savePointList');
    list.innerHTML = '';
    savePoints.forEach((sp,idx) => {
      const row = document.createElement('div');
      row.className = 'layer-row';
      row.innerHTML = `<span class="lname">${sp.name}</span><button data-act="restore">Restaurer</button><button data-act="del">🗑</button>`;
      row.querySelector('[data-act="restore"]').addEventListener('click', () => restoreSavePoint(idx));
      row.querySelector('[data-act="del"]').addEventListener('click', () => { savePoints.splice(idx,1); renderSavePoints(); });
      list.appendChild(row);
    });
  }
  document.getElementById('addSavePointBtn').addEventListener('click', captureSavePoint);

  settingsToggle.addEventListener('click', () => {
    panelWrap.classList.toggle('open');
    settingsToggle.classList.toggle('open');
  });
  const ptabs = document.querySelectorAll('.ptab');
  const psections = document.querySelectorAll('.panel-section');
  ptabs.forEach(t => {
    t.addEventListener('click', () => {
      ptabs.forEach(x=>x.classList.remove('active'));
      psections.forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      document.getElementById('panel-'+t.dataset.panel).classList.add('active');
    });
  });

  // symmetry controls
  const symCount_el = document.getElementById('symCount');
  const symCountLabel = document.getElementById('symCountLabel');
  symCount_el.addEventListener('input', e => { symCount = parseInt(e.target.value,10); symCountLabel.textContent = symCount; drawGrid(); });
  document.getElementById('symMirror').addEventListener('change', e => { symMirror = e.target.checked; });
  document.getElementById('symShowAxes').addEventListener('change', e => { symShowAxes = e.target.checked; drawGrid(); });
  document.getElementById('symMoveCenter').addEventListener('change', e => { movingSymCenter = e.target.checked; });

  // quill controls
  const nibAngle_el = document.getElementById('nibAngle');
  const nibAngleLabel = document.getElementById('nibAngleLabel');
  nibAngle_el.addEventListener('input', e => { nibAngleDeg = parseInt(e.target.value,10); nibAngleLabel.textContent = nibAngleDeg + '°'; });

  // brush controls
  const brushButtons = document.querySelectorAll('#panel-brushset .choice-row button');
  brushButtons.forEach(b => {
    b.addEventListener('click', () => { brushType = b.dataset.brush; brushButtons.forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
  });
  document.getElementById('brushOpacity').addEventListener('input', e => { brushOpacity = parseInt(e.target.value,10)/100; });

  // shape controls
  const shapeButtons = document.querySelectorAll('#panel-shapeset .choice-row button');
  shapeButtons.forEach(b => {
    b.addEventListener('click', () => { shapeType = b.dataset.shape; shapeButtons.forEach(x=>x.classList.remove('active')); b.classList.add('active'); });
  });
  document.getElementById('shapeFill').addEventListener('change', e => { shapeFill = e.target.checked; });

  // canvas background controls
  const bgButtons = document.querySelectorAll('.bg-swatch');
  function setBackground(color){
    bgColor = color;
    document.documentElement.style.setProperty('--parchment', color);
  }
  bgButtons.forEach(b => {
    b.addEventListener('click', () => {
      setBackground(b.dataset.bg);
      bgButtons.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      document.getElementById('customBg').value = b.dataset.bg;
    });
  });
  document.getElementById('customBg').addEventListener('input', e => { setBackground(e.target.value); bgButtons.forEach(x=>x.classList.remove('active')); });

  // canvas size / preset controls
  const presetButtons = document.querySelectorAll('#panel-toile .choice-row button[data-preset]');
  presetButtons.forEach(b => {
    b.addEventListener('click', () => {
      presetButtons.forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      applyPreset(b.dataset.preset);
      const rect = wrap.getBoundingClientRect();
      document.getElementById('canvasWInput').value = Math.round(rect.width);
      document.getElementById('canvasHInput').value = Math.round(rect.height);
    });
  });
  document.getElementById('applySizeBtn').addEventListener('click', () => {
    const w = Math.max(100, Math.min(4000, parseInt(document.getElementById('canvasWInput').value,10) || cssW));
    const h = Math.max(100, Math.min(4000, parseInt(document.getElementById('canvasHInput').value,10) || cssH));
    presetButtons.forEach(x=>x.classList.remove('active'));
    applyCanvasSize(w,h);
  });

  // guide controls
  const fileInput = document.getElementById('fileInput');
  fileInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev => { guideImg.src = ev.target.result; guideImg.style.display='block'; guideImg.style.opacity = guideOpacity; };
    reader.readAsDataURL(file);
  });
  document.getElementById('guideOpacity').addEventListener('input', e => { guideOpacity = parseInt(e.target.value,10)/100; guideImg.style.opacity = guideOpacity; });
  document.getElementById('clearGuideBtn').addEventListener('click', () => { guideImg.src=''; guideImg.style.display='none'; });

  // grid controls
  document.getElementById('gridToggle').addEventListener('change', e => { gridOn = e.target.checked; drawGrid(); });
  document.getElementById('gridSpacing').addEventListener('input', e => { gridSpacing = parseInt(e.target.value,10); drawGrid(); });
  document.getElementById('addGuideHBtn').addEventListener('click', () => { guidesH.push(cssH/2); drawGrid(); });
  document.getElementById('addGuideVBtn').addEventListener('click', () => { guidesV.push(cssW/2); drawGrid(); });
  document.getElementById('clearGuidesBtn').addEventListener('click', () => { guidesH=[]; guidesV=[]; drawGrid(); });
  document.getElementById('moveGuidesToggle').addEventListener('change', e => { movingGuides = e.target.checked; });

  // ---------- block native browser pinch-zoom outside the canvas ----------
  // Phones often zoom the whole page on a stray two-finger touch even when
  // the viewport meta tag asks them not to. Only the canvas itself should
  // ever be pinch-zoomed (that's handled separately above).
  document.addEventListener('touchmove', e => {
    if(e.touches.length > 1 && !wrap.contains(e.target)){
      e.preventDefault();
    }
  }, {passive:false});
  document.addEventListener('gesturestart', e => e.preventDefault());

  // ---------- robust real viewport height (fixes iOS Safari cutting off UI) ----------
  function setRealViewportHeight(){
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.body.style.height = h + 'px';
    resizeAll(true);
  }
  setRealViewportHeight();
  window.addEventListener('resize', setRealViewportHeight);
  window.addEventListener('orientationchange', () => setTimeout(setRealViewportHeight, 100));
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize', setRealViewportHeight);
  }

  // ---------- init ----------
  resizeAll(false);
  addLayer('Calque 1');
  setColor(currentColor);
  applyStageTransform();
})();
</script>

</body>
</html>
